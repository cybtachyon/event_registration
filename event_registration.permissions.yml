add event_registration entities:
  title: 'Create new Registration entities'

administer event_registration entities:
  title: 'Administer Registration entities'
  description: 'Allow to access the administration form to configure Registration entities.'
  restrict access: true

delete event_registration entities:
  title: 'Delete Registration entities'

edit event_registration entities:
  title: 'Edit Registration entities'

view published event_registration entities:
  title: 'View published Registration entities'

view unpublished event_registration entities:
  title: 'View unpublished Registration entities'

view all event_registration revisions:
  title: 'View all Registration revisions'

revert all event_registration revisions:
  title: 'Revert all Registration revisions'
  description: 'Role requires permission <em>view Registration revisions</em> and <em>edit rights</em> for event_registration entities in question or <em>administer event_registration entities</em>.'

delete all event_registration revisions:
  title: 'Delete all revisions'
  description: 'Role requires permission to <em>view Registration revisions</em> and <em>delete rights</em> for event_registration entities in question or <em>administer event_registration entities</em>.'

permission_callbacks:
  - \Drupal\event_registration\RegistrationPermissions::generatePermissions
