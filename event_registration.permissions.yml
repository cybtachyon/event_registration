  title: 'Create new Registration type entities'

administer registration type entities:
  title: 'Administer Registration type entities'
  description: 'Allow to access the administration form to configure Registration type entities.'
  restrict access: true

delete registration type entities:
  title: 'Delete Registration type entities'

edit registration type entities:
  title: 'Edit Registration type entities'

view published registration type entities:
  title: 'View published Registration type entities'

view unpublished registration type entities:
  title: 'View unpublished Registration type entities'

view all registration type revisions:
  title: 'View all Registration type revisions'

revert all registration type revisions:
  title: 'Revert all Registration type revisions'
  description: 'Role requires permission <em>view Registration type revisions</em> and <em>edit rights</em> for registration type entities in question or <em>administer registration type entities</em>.'

